services:
  postgres:
    image: postgres:16-alpine
    container_name: kallol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kallol
      POSTGRES_PASSWORD: kallol_password
      POSTGRES_DB: kallol_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kallol"]
      interval: 5s
      timeout: 5s
      retries: 5

  kallol-site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://kallol:kallol_password@postgres:5434/kallol_db
    ports:
      - "3007:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://kallol:kallol_password@postgres:5434/kallol_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
